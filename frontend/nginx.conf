# Serves the built React app and forwards API/admin traffic to Django (the "web" service).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 2m;

    # Django: API, admin panel and its static files
    location ~ ^/(api|admin|static)/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # keep https if TLS ended at a load balancer in front of nginx
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Live room chat (WebSockets) -> Django Channels
    location /ws/ {
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # keep idle chat connections open
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Vite's hashed build files never change, so browsers can cache them for a year
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routes (/room-page, /forum/apex, ...) all load the React app
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
